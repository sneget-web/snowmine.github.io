<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хронология серверов</title>
    
    <!-- Подключаем иконку сайта -->
    <link rel="icon" type="image/png" href="images\favicon42.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>


    
    <div class="site-background" id="bg-element"></div>
    
 
    <!-- Плашка «Сайт в разработке» слева сверху -->
    <div class="top-nav-left">
        <div class="dev-badge">
            <div class="dev-dot"></div>
            Сайт в разработке
        </div>
    </div>

    <!-- Кнопки навигации справа сверху -->
<!-- Новая навигация справа в стиле YouTube -->
<!-- Новая навигация справа (светлый прозрачный стиль) -->
    <div class="top-nav-right">
        
        <!-- Кнопка Новостей (Переливается цветом) -->
        <button id="news-btn" class="icon-btn news-icon-btn" title="Новости и обновления">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                <path d="M18 14h-8"></path>
                <path d="M15 18h-5"></path>
                <path d="M10 6h8v4h-8z"></path>
            </svg>
        </button>

                <!-- Кнопка капля Вкл/Выкл фоновых эффектов (погода и фильтр вместе) -->
        <button id="effects-toggle-btn" class="icon-btn" title="Вкл/Выкл фоновые эффекты (погода и фильтр)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        </button>

        <!-- Кнопка Telegram (Белый самолетик) -->
        <a href="https://t.me/snowmine1" target="_blank" class="icon-btn" title="ТГК">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </a>

        <!-- Кнопка Тир-листа -->
        <button id="open-tierlist-btn" class="icon-btn" title="Тир-лист">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </button>

        <!-- Кнопка ввода кода (Иконка терминала) -->
        <button id="secret-console-btn" class="icon-btn" title="Ввести код">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
        </button>



    </div>

    <div class="timeline-wrapper" id="scroll-container">
        <div class="timeline" id="timeline">
            <!-- Невидимый широкий хитбокс для удобного перетаскивания -->
            <div class="timeline-drag-area"></div>
        </div>
    </div>
    <!-- Индикаторы края (маркеры таймлайна) -->
<!-- Индикаторы края (маркеры таймлайна) -->
    <div id="scroll-indicator-left" class="scroll-indicator left" title="Есть сезоны в прошлом"></div>
    <div id="scroll-indicator-right" class="scroll-indicator right" title="Есть сезоны в будущем"></div>

    <!-- Всплывающая оранжевая полоса прогресса снизу -->
    <div id="bottom-progress-container" class="bottom-progress-container">
        <div id="bottom-progress-bar" class="bottom-progress-bar"></div>
    </div>

    

    <!-- 1. Модальное окно СЕЗОНА -->
    <div class="modal" id="modal">
        <div class="modal-content season-modal-content">
            
            <!-- Фиксированная верхняя плашка -->
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <span class="close-btn" id="close-modal">&times;</span>
            </div>

            <!-- Прокручиваемая область под плашкой -->
            <div class="modal-body">
                <h3 id="modal-version" style="color: #4CAF50; margin-top: 5px; margin-bottom: 15px;"></h3>
                <div class="modal-divider"></div>
                <div id="modal-body-content"></div>
                
                <div class="modal-divider"></div>
                <a href="#" id="modal-download" target="_blank" class="download-btn">Скачать мир</a>
            </div>

        </div>
    </div>


    <!-- 2. Модальное окно НОВОСТЕЙ -->
    <div class="modal" id="news-modal">
        <div class="modal-content season-modal-content">
            <!-- Закрепленная верхняя плашка -->
            <div class="modal-header">
                <h2>Новости</h2>
                <span class="close-btn" id="close-news">&times;</span>
            </div>
            <!-- Скроллируемая часть -->
            <div class="modal-body" id="news-container">
                <!-- Сюда скрипт вставит новости -->
            </div>
        </div>
    </div>

    <!-- 3. Модальное окно ТИР-ЛИСТА -->
    <div class="modal" id="tierlist-modal">
        <!-- ДОБАВЛЕН КЛАСС tierlist-wide -->
        <div class="modal-content season-modal-content tierlist-wide">
            
            <!-- Фиксированная верхняя плашка -->
            <div class="modal-header">
                <h2>Оцените сезоны</h2>
                <span class="close-btn" id="close-tierlist-btn">&times;</span>
            </div>
            
            <!-- Прокручиваемая область контента -->
            <div class="modal-body" id="tierlist-body-content">
                <!-- Сюда динамически рендерится тир-лист из скрипта -->
            </div>
            
        </div>
    </div>

    <!-- Перед подключением скриптов сезонов[cite: 3] -->
    <script>
        const seasons = [];
        const news = [];
    </script>
    
    <script src="data/news.js"></script>
    
    <script src="data/tierlist.js"></script>
    <script src="data/players.js"></script>
    <!-- Подключаем сезоны -->
    <script src="data/season1.js"></script>
    <script src="data/season1SB.js"></script>
    <script src="data/season2.js"></script>
    <script src="data/season3.js"></script>
    <script src="data/season4.js"></script>
    <script src="data/season5.js"></script>
    <!-- <script src="data/season2.js"></script> -->
    

    
<!-- Лайтбокс для просмотра фото -->
    <div class="image-lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="Полный размер">
    </div>


        <!-- ВСТРОЕННАЯ КОНСОЛЬ СЕКРЕТНЫХ КОМАНД -->
    <div id="console-modal" class="console-modal">
        <div class="console-modal-content">
            <div class="console-header">
                <div class="console-title">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    <span>Системная Консоль</span>
                </div>
                <button id="console-close-btn" class="console-close">&times;</button>
            </div>
            
            <!-- Область вывода сообщений -->
            <div id="console-output" class="console-output">
                <div class="console-line system">Добро пожаловать в терминал! Введите <b>help</b> для просмотра всех доступных команд.</div>
            </div>

            <!-- Поле ввода команды (без кнопки «Ввод», отправка по нажатию Enter) -->
            <form id="console-form" class="console-input-row">
                <span class="console-prompt">&gt;</span>
                <input type="text" id="console-input" placeholder="Введите команду или код..." autocomplete="off">
            </form>
        </div>
    </div>



    <script src="app.js"></script>
</body>
</html>
